name: Android APK

# Builds the Android app (mobile/, the web app in frontend/ packaged with
# Capacitor) and publishes it as a GitHub release of this repository.
#
# Run it from the Actions tab ("Run workflow") with a version like 1.0.0, or
# push a tag like v1.0.0.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   VITE_SUPABASE_URL, VITE_SUPABASE_PUBLISHABLE_KEY, VITE_API_URL
#     the same values as for the website (browser-safe values).
#   DV_KEYSTORE_BASE64, DV_KEYSTORE_PASSWORD, DV_KEY_ALIAS, DV_KEY_PASSWORD
#     the signing key (see mobile/README.md). Keep it: updates only install
#     over an app signed with the same key.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, e.g. 1.0.0'
        required: true
        default: '1.0.0'
      test_build:
        description: 'Only check that the APK builds (placeholder settings, nothing is published)'
        type: boolean
        default: false
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      SECRET_VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || vars.VITE_SUPABASE_URL }}
      SECRET_VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      SECRET_VITE_API_URL: ${{ secrets.VITE_API_URL || vars.VITE_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version }}"
          if [ -z "$VERSION" ]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          IFS=. read -r MAJOR MINOR PATCH <<< "$VERSION"
          CODE=$(( ${MAJOR:-0} * 10000 + ${MINOR:-0} * 100 + ${PATCH:-0} ))
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION (code $CODE)"

      - name: App settings
        # Repository secrets or variables first, otherwise mobile/app.env.
        run: |
          set -a
          . mobile/app.env
          set +a
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY VITE_API_URL; do
            secret="SECRET_$name"
            value="${!secret:-${!name}}"
            if [ "${{ github.event.inputs.test_build }}" = "true" ] && [ -z "$value" ]; then value="https://example.invalid"; fi
            if [ -z "$value" ]; then
              echo "::error::$name is missing: add it as a secret or to mobile/app.env."
              exit 1
            fi
            echo "$name=$value" >> "$GITHUB_ENV"
          done
          case "$(grep '^VITE_API_URL=' "$GITHUB_ENV" | tail -1)" in
            *localhost*|*127.0.0.1*) echo "::warning::VITE_API_URL points to localhost, which a phone cannot reach. Use the deployed Worker address." ;;
          esac

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build the web app
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Copy it into the Android project
        working-directory: mobile
        run: |
          npm ci
          npx cap sync android

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Signing key
        env:
          DV_KEYSTORE_BASE64: ${{ secrets.DV_KEYSTORE_BASE64 || vars.DV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$DV_KEYSTORE_BASE64" ]; then
            echo "$DV_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "DV_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "Signing with the release key in mobile/android/release"
          fi

      - name: Build the APK
        working-directory: mobile/android
        env:
          DV_KEYSTORE_PASSWORD: ${{ secrets.DV_KEYSTORE_PASSWORD || vars.DV_KEYSTORE_PASSWORD }}
          DV_KEY_ALIAS: ${{ secrets.DV_KEY_ALIAS || vars.DV_KEY_ALIAS }}
          DV_KEY_PASSWORD: ${{ secrets.DV_KEY_PASSWORD || vars.DV_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon \
            -PdvVersionCode=${{ steps.version.outputs.code }} \
            -PdvVersionName=${{ steps.version.outputs.version }}
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/DastaVault-${{ steps.version.outputs.version }}.apk"
          APKSIGNER=$(ls $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          $APKSIGNER verify --print-certs "$GITHUB_WORKSPACE/DastaVault-${{ steps.version.outputs.version }}.apk" | grep -E "DN|SHA-256"

      - name: Publish for in-app updates
        # The app reads latest.json from this public Supabase Storage bucket
        # (frontend/src/components/common/AppUpdate.jsx), also before sign-in.
        if: github.event.inputs.test_build != 'true'
        env:
          SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          if [ -z "$SERVICE_ROLE" ]; then
            echo "::warning::SUPABASE_SERVICE_ROLE_KEY is missing: in-app updates are not published."
            exit 0
          fi
          BASE="${VITE_SUPABASE_URL%/}/storage/v1"
          AUTH=(-H "Authorization: Bearer $SERVICE_ROLE" -H "apikey: $SERVICE_ROLE")
          curl -s -X POST "$BASE/bucket" "${AUTH[@]}" -H "Content-Type: application/json" \
            --data '{"id":"app-releases","name":"app-releases","public":true}' || true
          echo
          APK="DastaVault-$VERSION.apk"
          curl -fsS -X POST "$BASE/object/app-releases/android/$APK" "${AUTH[@]}" \
            -H "Content-Type: application/vnd.android.package-archive" -H "x-upsert: true" --data-binary "@$APK"
          echo
          SIZE=$(stat -c %s "$APK")
          printf '{"version":"%s","versionCode":%s,"apkUrl":"%s","size":%s}\n' \
            "$VERSION" "$CODE" "$BASE/object/public/app-releases/android/$APK" "$SIZE" > latest.json
          cat latest.json
          curl -fsS -X POST "$BASE/object/app-releases/android/latest.json" "${AUTH[@]}" \
            -H "Content-Type: application/json" -H "Cache-Control: no-cache" -H "x-upsert: true" --data-binary @latest.json
          echo

      - uses: actions/upload-artifact@v4
        with:
          name: DastaVault-${{ steps.version.outputs.version }}
          path: DastaVault-${{ steps.version.outputs.version }}.apk

      - name: Publish the release
        if: github.event.inputs.test_build != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cat > notes.md <<NOTES
          DastaVault $VERSION for Android.

          Download **DastaVault-$VERSION.apk** below and open it on your phone. If Android asks, allow installing apps from your browser or file manager.
          NOTES
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "DastaVault-$VERSION.apk" --clobber
          else
            gh release create "v$VERSION" "DastaVault-$VERSION.apk" --target "$GITHUB_SHA" --title "DastaVault $VERSION" --notes-file notes.md
          fi
