# Temporary: compares Workers AI vision models on a made-up form with handwriting.
name: AI vision probe
on:
  push:
    branches: [ccr-f8abd89d-w3g0kp]
    paths: [.github/workflows/ai-vision-probe.yml]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Make a form with handwriting
        run: |
          pip install -q pillow
          curl -sSL -o caveat.ttf "https://github.com/google/fonts/raw/main/ofl/caveat/Caveat%5Bwght%5D.ttf"
          curl -sSL -o hand2.ttf "https://github.com/google/fonts/raw/main/ofl/homemadeapple/HomemadeApple-Regular.ttf"
          python3 - <<'PY'
          from PIL import Image, ImageDraw, ImageFont
          W, H = 1200, 1500
          im = Image.new('RGB', (W, H), (245, 243, 238)); d = ImageDraw.Draw(im)
          p = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf', 24)
          b = ImageFont.truetype('/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf', 26)
          h = ImageFont.truetype('caveat.ttf', 46); h2 = ImageFont.truetype('hand2.ttf', 30)
          d.text((140, 80), 'EMPLOYEE DATA CONFIDENTIALITY AND NON-DISCLOSURE UNDERTAKING', font=b, fill='black')
          d.text((80, 170), 'I, ______________________, working as a Developer/Tester, hereby undertake', font=p, fill='black')
          d.text((115, 140), 'Ravi Sharma', font=h, fill=(20, 40, 140))
          y = 220
          for line in ['and agree to the following in connection with the migration of employee', 'data from the Company\'s existing ERP system to its new HRMS portal:', '', '1. Confidentiality of Employee Data: I shall maintain strict confidentiality', '   of all employee data accessed during the data migration.', '2. No Copying or Retention of Data: I shall not retain any employee data.', '3. Authorised Use Only: I shall use employee data solely for the migration.']:
              d.text((80, y), line, font=p, fill='black'); y += 40
          y += 60
          for label, value, f in [('Name:', 'Ravi Sharma', h), ('Designation:', 'Associate Software Developer', h), ('Department:', 'Engineering / Development', h), ('Signature:', 'Ravi', h2), ('Date:', '16-Oct-2026', h)]:
              d.text((80, y + 18), label, font=p, fill='black'); d.line((260, y + 46, 900, y + 46), fill='black', width=1)
              d.text((270, y - 6), value, font=f, fill=(20, 40, 140)); y += 90
          im = im.rotate(1.5, expand=True, fillcolor=(60, 60, 60)).resize((900, 1140))
          im.save('form.jpg', quality=85)
          PY
          ls -la form.jpg
      - name: Ask the models
        run: |
          python3 - <<'PY'
          import base64, json, os, time, urllib.request
          acct = os.environ['CLOUDFLARE_ACCOUNT_ID']; tok = os.environ['CLOUDFLARE_API_TOKEN']
          img = open('form.jpg', 'rb').read(); b64 = base64.b64encode(img).decode()
          prompt = ('Read this document photo, including handwriting. Reply with JSON only: '
                    '{"text": all text as written, "title": heading, "person_name": the person it belongs to, '
                    '"designation": job title if any, "department": if any, "date": date written on it as YYYY-MM-DD, '
                    '"document_type": one word, "summary": one sentence saying what it is and who signed}')
          def run(model, body):
              req = urllib.request.Request(f'https://api.cloudflare.com/client/v4/accounts/{acct}/ai/run/{model}', data=json.dumps(body).encode(), headers={'Authorization': f'Bearer {tok}', 'Content-Type': 'application/json'})
              t = time.time()
              try:
                  with urllib.request.urlopen(req, timeout=120) as r: out = json.load(r)
              except urllib.error.HTTPError as e: out = {'http': e.code, 'body': e.read().decode()[:600]}
              print(f'\n===== {model} ({time.time() - t:.1f}s)'); print(json.dumps(out, indent=1)[:3000])
          run('@cf/meta/llama-3.2-11b-vision-instruct', {'prompt': 'agree'})
          run('@cf/meta/llama-3.2-11b-vision-instruct', {'messages': [{'role': 'user', 'content': prompt}], 'image': list(img), 'max_tokens': 900})
          url = 'data:image/jpeg;base64,' + b64
          msg = [{'role': 'user', 'content': [{'type': 'text', 'text': prompt}, {'type': 'image_url', 'image_url': {'url': url}}]}]
          for m in ['@cf/mistralai/mistral-small-3.1-24b-instruct', '@cf/google/gemma-3-12b-it', '@cf/meta/llama-4-scout-17b-16e-instruct']:
              run(m, {'messages': msg, 'max_tokens': 900})
          PY
